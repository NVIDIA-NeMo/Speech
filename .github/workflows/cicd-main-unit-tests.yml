name: NeMo Unit Tests
on:
  workflow_call:
    inputs:
      test_to_run:
        required: true
        type: string
      runner:
        required: false
        default: nemo-ci-aws-gpu-x2
        type: string
        description: "Runner to use for GPU jobs"
      cpu-runner:
        required: false
        default: nemo-ci-aws-gpu-x2
        type: string
        description: "Runner to use for CPU-only unit-test jobs"
      cpu-test-data-path:
        required: false
        default: ''
        type: string
        description: "Host test-data path on the CPU runner (empty: same as GPU runners)"
      container-image:
        required: true
        type: string
        description: "Full image URL with tag for the NeMo container"

jobs:
  collections-common-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: L0_Unit_Tests_CPU_Common
            runner: ${{ inputs.cpu-runner }}
            cpu-only: true
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.script }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Checkout NeMo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ github.run_id }}
      - name: main
        uses: ./.github/actions/test-template
        with:
          runner: ${{ runner.name }}
          script: ${{ matrix.script }}
          is_unit_test: true
          tests_to_run: ${{ inputs.test_to_run }}
          image: ${{ inputs.container-image }}
          test-data-path: ${{ matrix.cpu-only && inputs.cpu-test-data-path || vars.DEFAULT_TEST_DATA_PATH || '/mnt/datadrive/TestData' }}
          timeout: ${{ matrix.timeout || 10 }}
          cpu-only: ${{ matrix.cpu-only || false }}

  core-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: L0_Unit_Tests_CPU_Core
            runner: ${{ inputs.cpu-runner }}
            cpu-only: true
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.script }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Checkout NeMo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ github.run_id }}
      - name: main
        uses: ./.github/actions/test-template
        with:
          runner: ${{ runner.name }}
          script: ${{ matrix.script }}
          is_unit_test: true
          tests_to_run: ${{ inputs.test_to_run }}
          image: ${{ inputs.container-image }}
          test-data-path: ${{ matrix.cpu-only && inputs.cpu-test-data-path || vars.DEFAULT_TEST_DATA_PATH || '/mnt/datadrive/TestData' }}
          timeout: ${{ matrix.timeout || 10 }}
          cpu-only: ${{ matrix.cpu-only || false }}

  other-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runs only `@pytest.mark.gpu` tests outside ASR and SpeechLM2 on pull requests (see
          # tests/functional_tests/_gpu_unit_test_selection.sh); scheduled runs cover all of them on GPU.
          - script: L0_Unit_Tests_GPU_Others
            runner: ${{ inputs.runner }}
            timeout: ${{ github.event_name == 'schedule' && 45 || 20 }}
          - script: L0_Unit_Tests_CPU_Others
            runner: ${{ inputs.cpu-runner }}
            cpu-only: true
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.script }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Checkout NeMo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ github.run_id }}
      - name: main
        uses: ./.github/actions/test-template
        with:
          runner: ${{ runner.name }}
          script: ${{ matrix.script }}
          is_unit_test: true
          tests_to_run: ${{ inputs.test_to_run }}
          image: ${{ inputs.container-image }}
          test-data-path: ${{ matrix.cpu-only && inputs.cpu-test-data-path || vars.DEFAULT_TEST_DATA_PATH || '/mnt/datadrive/TestData' }}
          timeout: ${{ matrix.timeout || 10 }}
          cpu-only: ${{ matrix.cpu-only || false }}
          is_optional: ${{ matrix.is-optional || false }}
