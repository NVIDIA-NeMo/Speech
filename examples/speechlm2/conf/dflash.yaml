# Reuse the target, data, parallelism, and checkpoint defaults from SALM.
# Launch with examples/speechlm2/dflash_train.py.
defaults:
  - salm_automodel
  - _self_

# Keep draft checkpoints separate from ordinary SALM resumes.
exp_manager:
  explicit_log_dir: dflash_results/
  name: dflash

# DFlash draft training from a frozen audio-conditioned SALMAutomodel.
# The defaults mirror the trainable dense core of
# nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DFlash: six non-causal
# Qwen3/GQA layers, 32 Q heads, 2 KV heads, 6144-wide MLPs, and the same six
# target-layer taps. The public checkpoint is a Model Optimizer W4A16_NVFP4
# inference artifact and cannot directly initialize these trainable BF16
# nn.Linear weights; these settings reproduce its architecture, not its weights.
#
# This integration supports DFlash and DFlash2 with BSHD or packed THD batches and
# tp_size=pp_size=cp_size=1. The DFlash2 defaults mirror Automodel's recipe: a
# two-tap grouped dynamic convolution and a rank-256 top-16 path selector. DFlash2
# needs dense draft logits for that selector. Both variants use dense draft logits.
dflash:
  init_from_pretrained: null  # Local HF draft export; weights only, fresh optimizer/scheduler.
  variant: dflash2  # dflash or dflash2
  label_source: target_argmax  # Frozen target's next-token top-1; use ground_truth for reference labels.
  target_argmax_chunk_size: 128  # Supervised positions per target vocabulary projection.
  projection_only: false  # DFlash2 warm start: train only fc.weight; requires init_from_pretrained.
  mask_token_id: 990
  draft_num_hidden_layers: 6
  target_layer_ids: [1, 5, 19, 29, 41, 51]
  draft_model_config:
    attention_bias: false
    attention_dropout: 0.0
    head_dim: 128
    hidden_act: silu
    intermediate_size: 6144
    max_position_embeddings: 1048576
    num_attention_heads: 32
    num_key_value_heads: 2
    rms_norm_eps: 1.0e-6
    rope_parameters:
      factor: 128.0
      original_max_position_embeddings: 8192
      rope_theta: 10000
      rope_type: yarn
    use_cache: false
  block_size: 8
  # Per row; packed THD uses one row, while BSHD allocation grows with batch size.
  num_anchors: 512
  loss_decay_gamma: 4.0
  draft_sliding_window: null
  attention_backend: flex_attention
  activation_checkpointing: true
  # DFlash2 in-block convolution and pairwise path selector (Automodel recipe defaults).
  conv_kernel_size: 2
  conv_group_size: 16
  selector_rank: 256
  selector_top_k: 16
  selector_loss_weight: 1.0
  use_fused_linear_ce: false  # SALM draft training uses dense logits.
  lr: 6.0e-4  # Default: AdamW, constant LR; no scheduler.
  # Optional Hydra optimizer/lr_scheduler overrides; see the DFlash training guide (dflash_training.rst).
  # optimizer: {_target_: torch.optim.AdamW, lr: 1.5e-4, weight_decay: 0.0}
  # lr_scheduler: {_target_: nemo.core.optim.lr_scheduler.CosineAnnealing, warmup_steps: 500, min_lr: 1e-6, max_steps: 8000}
  output_dir: ./outputs/salm_dflash
