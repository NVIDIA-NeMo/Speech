# Experimental opt-in complete-text async CFG with inline output; validated on the pinned P5 fixture.
pipeline: easymagpie_cfg_async
async_chunk: true
trust_remote_code: true
dtype: float16
distributed_executor_backend: uni
enable_prefix_caching: false
enable_chunked_prefill: false
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 8
      codec_startup_chunk_frames:
      - 6
      - 6
stages:
- stage_id: 0
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  max_model_len: 4096
  gpu_memory_utilization: 0.5
  enforce_eager: false
  compilation_config:
    mode: 3
    cudagraph_mode: FULL_AND_PIECEWISE
    cudagraph_capture_sizes:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
    max_cudagraph_capture_size: 512
  async_scheduling: true
  devices: '0'
  env:
    VLLM_USE_V2_MODEL_RUNNER: '0'
  output_connectors:
    to_stage_1: connector_of_shared_memory
  mamba_ssm_cache_dtype: float32
  mamba_cache_mode: none
  skip_tokenizer_init: false
  engine_extras:
    worker_cls: easymagpie_vllm_omni.runner.EasyMagpieGPUARWorker
  default_sampling_params:
    temperature: 0.0
    detokenize: false
    max_tokens: 2048
- stage_id: 1
  max_num_seqs: 32
  max_num_batched_tokens: 2048
  max_model_len: 2048
  gpu_memory_utilization: 0.35
  dtype: float32
  enforce_eager: true
  compilation_config:
    mode: 0
    cudagraph_mode: NONE
  async_scheduling: false
  devices: '0'
  env:
    VLLM_USE_V2_MODEL_RUNNER: '0'
  input_connectors:
    from_stage_0: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.0
    max_tokens: 65536
