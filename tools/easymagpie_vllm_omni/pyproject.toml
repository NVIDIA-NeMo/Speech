[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "easymagpie-vllm-omni"
version = "0.1.0"
description = "vLLM-Omni model definition for EasyMagpieTTS (Nemotron-H hybrid-Mamba backbone + AR local transformer)"
requires-python = ">=3.10"
dependencies = [
    # The heavy runtime deps (vllm, vllm-omni, torch) are provided by the
    # target vllm_omni_env. Treat this as "install into an already-bootstrapped
    # vllm_omni_env"; do not install into NeMo's nemo_virtual_environment.
]

[project.optional-dependencies]
# Resemble Perth from yhayarannvidia/Perth: perth.perth_net does not import
# librosa/soxr. Serving uses PerthNet + torchaudio STFT only.
perth = [
    "resemble-perth @ git+https://github.com/yhayarannvidia/Perth.git@9bd18489a5863f8cfc7b8906f7480d78898d1e64",
    "torchaudio",
]

[project.entry-points."vllm.general_plugins"]
easymagpie_omni = "vllm_plugin_easymagpie_omni:register"

[tool.setuptools.packages.find]
include = ["easymagpie_vllm_omni*", "vllm_plugin_easymagpie_omni*"]
