[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-roundtrip-eval"
version = "0.1.0"
description = "Resumable text-to-speech, ASR, and transcript evaluation stages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
speech-roundtrip = "speech_roundtrip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speech_roundtrip = ["prompts/*.txt"]
